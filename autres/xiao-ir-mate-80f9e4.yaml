substitutions:
  name: xiao-ir-mate-80f9e4
  friendly_name: XIAO Smart IR Mate 80f9e4

packages:
  Seeed.Xiao IR Proxy: "github://esphome/infrared-proxies/xiao-ir-mate/xiao-ir-mate.yaml"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret xiao_ir_mate_80f9e4_api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ─── Ajout : active le décodage IR dans les logs ───
remote_receiver:
  - id: !extend ir_rx
    dump: all
    tolerance: 55%
    idle: 25ms
